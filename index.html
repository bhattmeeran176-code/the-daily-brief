  <body>
  <div id="root"></div>

  <script>
    window.addEventListener("error", function(e) {
      document.body.insertAdjacentHTML("beforeend",
        '<pre style="position:fixed;inset:10px;background:white;color:red;padding:15px;z-index:999999;overflow:auto;white-space:pre-wrap">ERROR: ' +
        e.message + '\nFile: ' + e.filename + '\nLine: ' + e.lineno + '</pre>');
    });

    window.addEventListener("unhandledrejection", function(e) {
      document.body.insertAdjacentHTML("beforeend",
        '<pre style="position:fixed;inset:10px;background:white;color:red;padding:15px;z-index:999999;overflow:auto">ERROR: ' +
        e.reason + '</pre>');
    });
  </script>

  <script type="module" src="/src/main.jsx"></script>
  </body>
